name: Build and Deploy Angular App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Secrets
        run: |
          echo "Checking secret values..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "ERROR: DOCKER_USERNAME is empty or not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "ERROR: DOCKER_PASSWORD is empty or not set"
            exit 1
          fi
          echo "✓ DOCKER_USERNAME is set (length: ${#DOCKER_USERNAME})"
          echo "✓ DOCKER_PASSWORD is set (length: ${#DOCKER_PASSWORD})"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t afifahhh783/docker-angular:latest .

      - name: Push Docker image
        run: |
          docker push afifahhh783/docker-angular:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull afifahhh783/docker-angular:latest
            
            # Stop and remove the angular-app container
            docker stop angular-app 2>/dev/null || true
            docker rm angular-app 2>/dev/null || true
            
            # Remove all stopped containers to free up resources
            docker container prune -f
            
            # Remove all dangling networks
            docker network prune -f
            
            # Find and kill the process using port 80
            PORT_PID=$(netstat -tulpn 2>/dev/null | grep ':80 ' | awk '{print $NF}' | cut -d'/' -f1)
            if [ ! -z "$PORT_PID" ] && [ "$PORT_PID" != "-" ]; then
              kill -9 $PORT_PID 2>/dev/null || true
            fi
            
            # Wait for port to be released
            sleep 3
            
            # Run the new container on port 80
            docker run -d \
              --name angular-app \
              -p 80:80 \
              afifahhh783/docker-angular:latest
