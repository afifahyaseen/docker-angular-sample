name: Build and Deploy Angular App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Secrets
        run: |
          echo "Checking secret values..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "ERROR: DOCKER_USERNAME is empty or not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "ERROR: DOCKER_PASSWORD is empty or not set"
            exit 1
          fi
          echo "✓ DOCKER_USERNAME is set (length: ${#DOCKER_USERNAME})"
          echo "✓ DOCKER_PASSWORD is set (length: ${#DOCKER_PASSWORD})"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t afifahhh783/docker-angular:latest .

      - name: Push Docker image
        run: |
          docker push afifahhh783/docker-angular:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull afifahhh783/docker-angular:latest
            
            # Stop and remove the angular-app container by force
            docker rm -f angular-app 2>/dev/null || true
            
            # Remove all stopped containers
            docker container prune -f
            
            # Remove dangling networks
            docker network prune -f
            
            # Remove dangling volumes  
            docker volume prune -f
            
            # Restart Docker daemon to clear any lingering port bindings
            sudo systemctl restart docker || sudo service docker restart || true
            
            # Wait for Docker daemon to fully restart
            sleep 5
            
            # Wait for port 80 to be available
            while netstat -tulpn 2>/dev/null | grep -q ':80 '; do
              echo "Port 80 still in use, waiting..."
              sleep 2
            done
            
            # Run the new container on port 80
            docker run -d \
              --name angular-app \
              -p 80:80 \
              afifahhh783/docker-angular:latest
            
            # Verify container is running
            docker ps | grep angular-app
